<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Graciosa Studio" />
  <link id="favicon" rel="icon" type="image/png" href="/image/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/image/favicon.png" />
  <link rel="apple-touch-icon" href="/image/favicon.png" />
  <script type="module">
    // Em runtime usamos import.meta.env (substituído pelo Vite durante build) se disponível,
    // caso contrário o href já tem fallback para /image/favicon.png
    try {
      const href = (import.meta.env?.VITE_APP_FAVICON) || '/image/favicon.png';
      const linkEl = document.getElementById('favicon');
      if (linkEl) linkEl.href = href;
    } catch (e) {
      // não fatal — manter fallback estático
    }
  </script>
  <title>Carregando...</title>
</head>

<body>
  <div id="root"></div>
  <!-- TESTE: Div fixa para verificar se o WebView renderiza elementos fixed -->
  <div id="nav-test" style="position:fixed;bottom:0;left:0;right:0;height:80px;background:#ff0000;z-index:999999;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:bold;">NAV TEST</div>
  <script type="module" src="/src/main.tsx"></script>
  <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
</body>

</html>
